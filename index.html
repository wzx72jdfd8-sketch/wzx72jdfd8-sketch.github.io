<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Earth — all GPS &amp; GEO (SGP4)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; left: 16px; top: 16px; z-index: 2; color: #e8f0ff; text-shadow: 0 2px 12px rgba(0,0,0,.75); max-width: min(460px, calc(100vw - 32px)); pointer-events: none; }
    #hud h1 { margin: 0 0 4px; font-size: clamp(1.15rem, 2.6vw, 1.55rem); font-weight: 650; letter-spacing: .04em; }
    .sub { margin: 0 0 10px; opacity: .75; font-size: .84rem; line-height: 1.35; }
    .legend { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; }
    .row { display: flex; gap: 8px; align-items: flex-start; }
    .swatch { width: 9px; height: 9px; border-radius: 50%; margin-top: 4px; flex: 0 0 auto; box-shadow: 0 0 8px currentColor; }
    .gps { background: #7cff9b; color: #7cff9b; }
    .geo { background: #5ce1ff; color: #5ce1ff; }
    .meta { opacity: .7; font-size: .75rem; }
    #panel { position: fixed; left: 16px; bottom: 16px; z-index: 2; color: #dce8ff; font-size: .8rem; background: rgba(6,10,20,.62); border: 1px solid rgba(140,180,255,.18); backdrop-filter: blur(8px); border-radius: 10px; padding: 10px 12px; min-width: min(340px, calc(100vw - 32px)); }
    #panel label { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    #panel input[type=range] { flex: 1; }
    #panel .btns { display: flex; gap: 6px; margin-top: 6px; }
    #panel button { background: #1a2740; color: #dce8ff; border: 1px solid #345; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    #panel button:hover { background: #243656; }
    #clock { font-variant-numeric: tabular-nums; opacity: .9; }
    #pick { position: fixed; right: 16px; top: 16px; z-index: 2; color: #e8f0ff; font-size: .82rem; line-height: 1.45; background: rgba(6,10,20,.62); border: 1px solid rgba(140,180,255,.18); backdrop-filter: blur(8px); border-radius: 10px; padding: 10px 12px; min-width: 210px; display: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #cfe4ff; background: #000; z-index: 3; transition: opacity .6s ease; }
    #loading.hide { opacity: 0; pointer-events: none; }
    .spinner { width: 42px; height: 42px; border: 3px solid #234; border-top-color: #7ec8ff; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "satellite.js": "https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.es.js"
  } }
  </script>
</head>
<body>
  <div id="loading"><div style="text-align:center"><div class="spinner"></div><div>Loading all GPS &amp; GEO TLEs…</div></div></div>
  <div id="hud">
    <h1>Earth</h1>
    <p class="sub">Every GPS operational and GEO-catalogue object · SGP4 · drag / scroll</p>
    <div class="legend">
      <div class="row"><span class="swatch gps"></span><div><strong>GPS operational</strong><div class="meta" id="gpsMeta">loading…</div></div></div>
      <div class="row"><span class="swatch geo"></span><div><strong>Geostationary catalogue</strong><div class="meta" id="geoMeta">loading…</div></div></div>
    </div>
  </div>
  <div id="pick"></div>
  <div id="panel">
    <div id="clock">—</div>
    <label>Speed <input id="speed" type="range" min="0" max="8" step="1" value="3" /> <span id="speedLbl">60×</span></label>
    <div class="btns"><button id="btnPause">Pause</button><button id="btnNow">Real time</button></div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import * as satellite from 'satellite.js';

    const TEX = {
      map:      'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
      normal:   'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg',
      specular: 'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg',
      lights:   'https://threejs.org/examples/textures/planets/earth_lights_2048.png',
      clouds:   'https://threejs.org/examples/textures/planets/earth_clouds_1024.png',
    };
    const R_EARTH = 6378.137;
    const SPEEDS = [1, 10, 30, 60, 300, 900, 3600, 7200, 21600];
    const GPS_URLS = [
      'https://raw.githubusercontent.com/satvisorcom/satvisor-data/master/celestrak/tle/gps-ops.tle',
      'https://celestrak.org/NORAD/elements/gp.php?GROUP=gps-ops&FORMAT=tle',
    ];
    const GEO_URLS = [
      'https://raw.githubusercontent.com/satvisorcom/satvisor-data/master/celestrak/tle/geo.tle',
      'https://celestrak.org/NORAD/elements/gp.php?GROUP=geo&FORMAT=tle',
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000005);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 800);
    camera.position.set(0, 3.6, 15);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = false;
    controls.minDistance = 2.3;
    controls.maxDistance = 40;
    const sun = new THREE.DirectionalLight(0xfff4e0, 2.3);
    sun.position.set(6, 2, 3);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x335577, 0.28));
    const rim = new THREE.DirectionalLight(0x88bbff, 0.32);
    rim.position.set(-4, -1, -2);
    scene.add(rim);

    {
      const count = 3400;
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 70 + Math.random() * 160;
        const th = Math.random() * Math.PI * 2;
        const ph = Math.acos(2 * Math.random() - 1);
        pos[i*3] = r * Math.sin(ph) * Math.cos(th);
        pos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
        pos[i*3+2] = r * Math.cos(ph);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.18, sizeAttenuation: true, transparent: true, opacity: 0.85 })));
    }

    function ecfToThree(ecf, target = new THREE.Vector3()) {
      return target.set(ecf.x / R_EARTH, ecf.z / R_EARTH, -ecf.y / R_EARTH);
    }
    function parseTle(text) {
      const lines = text.split(/\r?\n/).map((l) => l.trimEnd()).filter((l) => l.length);
      const out = [];
      for (let i = 0; i < lines.length - 1; i++) {
        if (lines[i].startsWith('1 ') && lines[i+1].startsWith('2 ')) {
          const name = (i > 0 && !lines[i-1].startsWith('1 ') && !lines[i-1].startsWith('2 '))
            ? lines[i-1].trim() : lines[i].slice(2, 7);
          const satrec = satellite.twoline2satrec(lines[i], lines[i+1]);
          if (satrec && satrec.error === 0) out.push({ name, satrec, norad: satrec.satnum });
          i++;
        }
      }
      return out;
    }
    async function loadFirst(urls) {
      for (const url of urls) {
        try {
          const res = await fetch(url, { cache: 'no-cache' });
          if (!res.ok) continue;
          const text = await res.text();
          const list = parseTle(text);
          if (list.length) return { list, url };
        } catch (_) {}
      }
      return null;
    }
    function makeSatModel(color, scale) {
      const g = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color, metalness: 0.55, roughness: 0.3, emissive: color, emissiveIntensity: 0.4 });
      const panelMat = new THREE.MeshStandardMaterial({ color: 0x163a7a, metalness: 0.5, roughness: 0.35, emissive: 0x0a1a40, emissiveIntensity: 0.2 });
      g.add(new THREE.Mesh(new THREE.BoxGeometry(0.07*scale, 0.04*scale, 0.04*scale), bodyMat));
      const pg = new THREE.BoxGeometry(0.14*scale, 0.003, 0.05*scale);
      const p1 = new THREE.Mesh(pg, panelMat); p1.position.x = 0.11*scale;
      const p2 = new THREE.Mesh(pg, panelMat); p2.position.x = -0.11*scale;
      g.add(p1, p2);
      g.add(new THREE.Mesh(new THREE.SphereGeometry(0.016*scale, 8, 8), new THREE.MeshBasicMaterial({ color })));
      return g;
    }
    function makeOrbitLine(points, color, opacity) {
      return new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
    }
    function sampleOrbitEcf(satrec, when, samples = 72) {
      const periodMs = (2 * Math.PI / satrec.no) * 60 * 1000;
      const pts = [];
      const v = new THREE.Vector3();
      for (let i = 0; i < samples; i++) {
        const d = new Date(when.getTime() + (i / samples) * periodMs);
        const pv = satellite.propagate(satrec, d);
        if (!pv.position) continue;
        const ecf = satellite.eciToEcf(pv.position, satellite.gstime(d));
        pts.push(ecfToThree(ecf, v).clone());
      }
      return pts;
    }

    const loader = new THREE.TextureLoader();
    loader.crossOrigin = 'anonymous';
    const loadTex = (url, srgb = true) => new Promise((resolve, reject) => {
      loader.load(url, (t) => {
        if (srgb) t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
        resolve(t);
      }, undefined, reject);
    });

    const dummy = new THREE.Object3D();
    let simOffsetMs = 0, speedIdx = 3, paused = false, lastWall = performance.now();

    try {
      const [map, normal, spec, lights, clouds, gpsPack, geoPack] = await Promise.all([
        loadTex(TEX.map), loadTex(TEX.normal, false), loadTex(TEX.specular, false),
        loadTex(TEX.lights), loadTex(TEX.clouds), loadFirst(GPS_URLS), loadFirst(GEO_URLS),
      ]);
      if (!gpsPack && !geoPack) throw new Error('No TLE catalogues loaded');
      const gpsList = gpsPack ? gpsPack.list : [];
      const geoList = geoPack ? geoPack.list : [];
      document.getElementById('gpsMeta').textContent = gpsList.length + ' satellites · full gps-ops catalogue · SGP4';
      document.getElementById('geoMeta').textContent = geoList.length + ' objects · full geo catalogue · SGP4';

      scene.add(new THREE.Mesh(new THREE.SphereGeometry(1, 96, 96), new THREE.MeshPhongMaterial({
        map, normalMap: normal, normalScale: new THREE.Vector2(0.85, 0.85),
        specularMap: spec, specular: new THREE.Color(0x333333), shininess: 12,
        emissiveMap: lights, emissive: new THREE.Color(0xffcc88), emissiveIntensity: 0.55,
      })));
      const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(1.015, 64, 64), new THREE.MeshLambertMaterial({ map: clouds, transparent: true, opacity: 0.38, depthWrite: false }));
      scene.add(cloudMesh);
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.08, 48, 48), new THREE.MeshBasicMaterial({ color: 0x4aa8ff, transparent: true, opacity: 0.08, side: THREE.BackSide })));

      {
        const r = 42164.0 / R_EARTH;
        const pts = [];
        for (let i = 0; i <= 160; i++) {
          const a = (i / 160) * Math.PI * 2;
          pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r));
        }
        scene.add(makeOrbitLine(pts, 0x5ce1ff, 0.2));
      }

      const gpsGroup = new THREE.Group();
      scene.add(gpsGroup);
      const gpsMeshes = [];
      for (const sat of gpsList) {
        const mesh = makeSatModel(0x7cff9b, 1.55);
        mesh.userData = sat;
        gpsGroup.add(mesh);
        const pts = sampleOrbitEcf(sat.satrec, new Date(), 80);
        const line = pts.length > 4 ? makeOrbitLine(pts, 0x7cff9b, 0.14) : null;
        if (line) gpsGroup.add(line);
        gpsMeshes.push({ sat, mesh, line });
      }

      const geoMesh = new THREE.InstancedMesh(
        new THREE.BoxGeometry(0.09, 0.045, 0.045),
        new THREE.MeshStandardMaterial({ color: 0x5ce1ff, metalness: 0.45, roughness: 0.35, emissive: 0x5ce1ff, emissiveIntensity: 0.35 }),
        Math.max(geoList.length, 1)
      );
      geoMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(geoMesh);

      const pickEl = document.getElementById('pick');
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      renderer.domElement.addEventListener('pointermove', (ev) => {
        const rec = renderer.domElement.getBoundingClientRect();
        pointer.x = ((ev.clientX - rec.left) / rec.width) * 2 - 1;
        pointer.y = -((ev.clientY - rec.top) / rec.height) * 2 + 1;
      });
      const clockEl = document.getElementById('clock');
      const speedEl = document.getElementById('speed');
      const speedLbl = document.getElementById('speedLbl');
      const fmt = (n) => n.toString().padStart(2, '0');
      const simDate = () => new Date(Date.now() + simOffsetMs);
      const formatStamp = (d) => d.getUTCFullYear() + '-' + fmt(d.getUTCMonth()+1) + '-' + fmt(d.getUTCDate()) + ' ' + fmt(d.getUTCHours()) + ':' + fmt(d.getUTCMinutes()) + ':' + fmt(d.getUTCSeconds()) + ' UTC';
      speedEl.addEventListener('input', () => { speedIdx = Number(speedEl.value); speedLbl.textContent = SPEEDS[speedIdx] + '×'; });
      document.getElementById('btnPause').addEventListener('click', (e) => { paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause'; });
      document.getElementById('btnNow').addEventListener('click', () => {
        simOffsetMs = 0; speedIdx = 0; speedEl.value = 0; speedLbl.textContent = '1×'; paused = false;
        document.getElementById('btnPause').textContent = 'Pause';
      });

      let trailAge = 0;
      document.getElementById('loading').classList.add('hide');

      function propagateOne(satrec, date) {
        const pv = satellite.propagate(satrec, date);
        if (!pv.position) return null;
        const gmst = satellite.gstime(date);
        return { ecf: satellite.eciToEcf(pv.position, gmst), gd: satellite.eciToGeodetic(pv.position, gmst) };
      }
      function showPick(name, norad, gd, kind) {
        const lat = gd ? satellite.degreesLat(gd.latitude).toFixed(2) : '—';
        const lon = gd ? satellite.degreesLong(gd.longitude).toFixed(2) : '—';
        const alt = gd ? gd.height.toFixed(0) : '—';
        pickEl.style.display = 'block';
        pickEl.innerHTML = '<b>' + name + '</b><br>' + kind + ' · NORAD ' + norad + '<br>' + lat + '°, ' + lon + '°<br>' + alt + ' km';
      }

      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min((now - lastWall) / 1000, 0.1);
        lastWall = now;
        if (!paused) simOffsetMs += dt * 1000 * (SPEEDS[speedIdx] - 1);
        const date = simDate();
        clockEl.textContent = formatStamp(date) + '  ·  ' + gpsList.length + ' GPS  ·  ' + geoList.length + ' GEO';
        cloudMesh.rotation.y += dt * 0.004;
        for (const item of gpsMeshes) {
          const st = propagateOne(item.sat.satrec, date);
          if (!st) { item.mesh.visible = false; continue; }
          item.mesh.visible = true;
          ecfToThree(st.ecf, item.mesh.position);
          item.mesh.lookAt(0, 0, 0);
          item.sat._gd = st.gd;
        }
        for (let i = 0; i < geoList.length; i++) {
          const st = propagateOne(geoList[i].satrec, date);
          if (!st) {
            dummy.position.set(0,0,0); dummy.scale.setScalar(0); dummy.updateMatrix();
            geoMesh.setMatrixAt(i, dummy.matrix); continue;
          }
          ecfToThree(st.ecf, dummy.position);
          dummy.scale.setScalar(1); dummy.lookAt(0,0,0); dummy.updateMatrix();
          geoMesh.setMatrixAt(i, dummy.matrix);
          geoList[i]._gd = st.gd;
        }
        geoMesh.instanceMatrix.needsUpdate = true;
        trailAge += dt;
        if (trailAge > 8) {
          trailAge = 0;
          for (const item of gpsMeshes) {
            if (!item.line) continue;
            const pts = sampleOrbitEcf(item.sat.satrec, date, 80);
            if (pts.length > 4) item.line.geometry.setFromPoints(pts);
          }
        }
        raycaster.setFromCamera(pointer, camera);
        const gpsHits = raycaster.intersectObjects(gpsMeshes.map(x => x.mesh), true);
        const geoHits = raycaster.intersectObject(geoMesh);
        if (gpsHits.length) {
          let obj = gpsHits[0].object;
          while (obj && !obj.userData.satrec) obj = obj.parent;
          if (obj) showPick(obj.userData.name, obj.userData.norad, obj.userData._gd, 'GPS');
        } else if (geoHits.length && geoHits[0].instanceId != null) {
          const sat = geoList[geoHits[0].instanceId];
          if (sat) showPick(sat.name, sat.norad, sat._gd, 'GEO');
        } else pickEl.style.display = 'none';
        controls.update();
        renderer.render(scene, camera);
      }
      requestAnimationFrame(animate);
    } catch (err) {
      console.error(err);
      document.getElementById('loading').innerHTML = '<div style="text-align:center;max-width:24rem">Could not load textures or TLE catalogues.</div>';
    }
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
